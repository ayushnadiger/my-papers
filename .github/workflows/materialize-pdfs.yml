name: Materialize ten paper PDFs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-pdfs.yml'
      - '01_high_rate_qldpc_interconnects/main.tex'
      - '02_2d_hybrid_repeaters/main.tex'
      - '03_trapped_ion_photonic_service/main.tex'
      - '04_gkp_resource_factories/main.tex'
      - '05_reset_aware_spin_photon/main.tex'
      - '06_stochastic_qldpc_factories/main.tex'
      - '07_repair_identifiability/main.tex'
      - '08_predictive_rank_qec/main.tex'
      - '09_covariance_geometry_qec/main.tex'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ten-paper-pdfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper00:
    name: Paper 00 - arXiv
    runs-on: ubuntu-latest
    steps:
      - name: Download canonical arXiv PDF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils curl
          mkdir -p out
          curl -A 'Mozilla/5.0' -L --fail --retry 5 --retry-delay 3 \
            https://arxiv.org/pdf/2608.24770 \
            -o out/main.pdf
          test -s out/main.pdf
          pdfinfo out/main.pdf >/dev/null
      - name: Upload paper 00
        uses: actions/upload-artifact@v4
        with:
          name: pdf-00
          path: out/main.pdf
          if-no-files-found: error

  compile:
    name: Paper ${{ matrix.id }} - compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: '01'
            dir: 01_high_rate_qldpc_interconnects
          - id: '02'
            dir: 02_2d_hybrid_repeaters
          - id: '03'
            dir: 03_trapped_ion_photonic_service
          - id: '04'
            dir: 04_gkp_resource_factories
          - id: '05'
            dir: 05_reset_aware_spin_photon
          - id: '06'
            dir: 06_stochastic_qldpc_factories
          - id: '07'
            dir: 07_repair_identifiability
          - id: '08'
            dir: 08_predictive_rank_qec
          - id: '09'
            dir: 09_covariance_geometry_qec
    steps:
      - name: Check out archive
        uses: actions/checkout@v4

      - name: Install TeX
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-science \
            texlive-publishers \
            poppler-utils

      - name: Compile ${{ matrix.dir }}/main.tex
        shell: bash
        run: |
          set -euo pipefail
          cd '${{ matrix.dir }}'
          rm -f __archive_build.*
          cat > __archive_build.tex <<'EOF'
          \PassOptionsToPackage{expansion=false}{microtype}
          \input{main.tex}
          EOF
          for pass in 1 2 3; do
            echo "pdflatex pass $pass"
            pdflatex -file-line-error -halt-on-error -interaction=nonstopmode __archive_build.tex
          done
          if grep -Eq 'Citation .* undefined|There were undefined citations|Reference .* undefined|There were undefined references' __archive_build.log; then
            echo 'ERROR: unresolved citation or reference remains after three passes' >&2
            grep -E 'undefined|Warning' __archive_build.log | tail -n 80 >&2 || true
            exit 1
          fi
          test -s __archive_build.pdf
          pdfinfo __archive_build.pdf >/dev/null
          mkdir -p ../artifact
          cp __archive_build.pdf ../artifact/main.pdf

      - name: Upload paper ${{ matrix.id }}
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.id }}
          path: artifact/main.pdf
          if-no-files-found: error

  commit:
    name: Commit exactly ten PDFs
    needs: [paper00, compile]
    runs-on: ubuntu-latest
    steps:
      - name: Check out archive
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download compiled PDFs
        uses: actions/download-artifact@v4
        with:
          pattern: pdf-*
          path: artifacts

      - name: Install PDF verifier
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Materialize exactly ten canonical PDFs
        shell: bash
        run: |
          set -euo pipefail

          declare -A dirs=(
            [00]='00_trapped_ion_geometry'
            [01]='01_high_rate_qldpc_interconnects'
            [02]='02_2d_hybrid_repeaters'
            [03]='03_trapped_ion_photonic_service'
            [04]='04_gkp_resource_factories'
            [05]='05_reset_aware_spin_photon'
            [06]='06_stochastic_qldpc_factories'
            [07]='07_repair_identifiability'
            [08]='08_predictive_rank_qec'
            [09]='09_covariance_geometry_qec'
          )

          for id in 00 01 02 03 04 05 06 07 08 09; do
            d="${dirs[$id]}"
            src="artifacts/pdf-$id/main.pdf"
            test -s "$src"
            mkdir -p "$d"
            find "$d" -maxdepth 1 -type f -name '*.pdf' -delete
            cp "$src" "$d/main.pdf"
            pdfinfo "$d/main.pdf" >/dev/null
          done

          rm -rf .staging artifacts

          cat > README.md <<'EOF'
          # Ayush Nadiger - Paper Archive

          This repository contains exactly ten compiled paper PDFs, numbered 00-09. Each numbered directory has one canonical `main.pdf`; source is retained for manuscripts 01-09.

          - `00_trapped_ion_geometry/` - **Geometry-controlled correlated electric-field noise in enclosed ion traps from billiard return spectra** - arXiv:2608.24770.
          - `01_high_rate_qldpc_interconnects/` - **High-Rate qLDPC Gates over Heralded Interconnects: QEC-Aware Entanglement Service**.
          - `02_2d_hybrid_repeaters/` - **Correction Exposure and Service Geometry in Sparse Hybrid Quantum Repeater Networks**.
          - `03_trapped_ion_photonic_service/` - **Fault-Tolerant Service Contracts for Integrated Trapped-Ion Photonic Interconnects**.
          - `04_gkp_resource_factories/` - **Throughput Is Not Enough: Synchronization and Loss Constraints for GKP-State Factories in High-Rate Photonic Repeaters**.
          - `05_reset_aware_spin_photon/` - **Occupancy-Aware Reset Control for Sequential Quantum Repeaters with Exposure-Aged Spin-Photon Interfaces**.
          - `06_stochastic_qldpc_factories/` - **Tanner Frontiers in Stochastic qLDPC Entanglement Factories**.
          - `07_repair_identifiability/` - **Repair Identifiability and Product-Measurement Complexity of Bond Failures in Graph States**.
          - `08_predictive_rank_qec/` - **Predictive Rank as a Circuit-Conditioned Memory Witness for Quantum Error-Correction Syndrome Records**.
          - `09_covariance_geometry_qec/` - **Covariance Geometry of Linearized Quantum Erasure Correction**.

          RA-FEAST and route-optimization work are intentionally not included in this archive.
          EOF

          mapfile -t pdfs < <(find 0[0-9]_* -maxdepth 1 -type f -name '*.pdf' | sort)
          printf '%s\n' "${pdfs[@]}"
          test "${#pdfs[@]}" -eq 10
          test ! -e .staging
          test ! -e artifacts

      - name: Commit archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Exactly ten PDFs are already materialized.'
            exit 0
          fi
          git commit -m 'Materialize exactly ten paper PDFs'
          git push

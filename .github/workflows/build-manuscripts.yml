name: Build mirrored manuscript packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: manuscript-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: paper-01-high-rate-qldpc
            root: 01_high_rate_qldpc_interconnects/main.tex
            pdf: 01_high_rate_qldpc_interconnects/main.pdf
          - name: supplement-01-high-rate-qldpc
            root: 01_high_rate_qldpc_interconnects/supplement.tex
            pdf: 01_high_rate_qldpc_interconnects/supplement.pdf
          - name: paper-02-hybrid-2d
            root: 02_2d_hybrid_repeaters/main.tex
            pdf: 02_2d_hybrid_repeaters/main.pdf
          - name: supplement-02-hybrid-2d
            root: 02_2d_hybrid_repeaters/supplement.tex
            pdf: 02_2d_hybrid_repeaters/supplement.pdf
          - name: paper-03-trapped-ion-service
            root: 03_trapped_ion_photonic_service/main.tex
            pdf: 03_trapped_ion_photonic_service/main.pdf
          - name: supplement-03-trapped-ion-service
            root: 03_trapped_ion_photonic_service/supplement.tex
            pdf: 03_trapped_ion_photonic_service/supplement.pdf
          - name: paper-04-gkp-factories
            root: 04_gkp_resource_factories/main.tex
            pdf: 04_gkp_resource_factories/main.pdf
          - name: supplement-04-gkp-factories
            root: 04_gkp_resource_factories/supplement.tex
            pdf: 04_gkp_resource_factories/supplement.pdf
          - name: paper-05-reset-aware
            root: 05_reset_aware_spin_photon/main.tex
            pdf: 05_reset_aware_spin_photon/main.pdf
          - name: supplement-05-reset-aware
            root: 05_reset_aware_spin_photon/supplement.tex
            pdf: 05_reset_aware_spin_photon/supplement.pdf
          - name: paper-06-stochastic-qldpc
            root: 06_stochastic_qldpc_factories/main.tex
            pdf: 06_stochastic_qldpc_factories/main.pdf
          - name: supplement-06-stochastic-qldpc
            root: 06_stochastic_qldpc_factories/supplement.tex
            pdf: 06_stochastic_qldpc_factories/supplement.pdf

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile ${{ matrix.name }}
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ matrix.root }}
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-pdf
          path: ${{ matrix.pdf }}
